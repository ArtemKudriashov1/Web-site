name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload site via SFTP (rsync over SSH)
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync >/dev/null
          sshpass -e rsync -rlvz --delete --no-perms --no-owner --no-group \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 22" \
            --exclude '.git' --exclude '.github' --exclude 'tools' --exclude 'README.md' \
            --exclude 'wrangler.jsonc' --exclude '.assetsignore' --exclude '.gitignore' \
            ./ "${{ secrets.FTP_USER }}@${{ secrets.FTP_HOST }}:httpdocs/"
