name: Deploy to hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload site via SFTP
        env:
          HOST: ${{ secrets.FTP_HOST }}
          USER: ${{ secrets.FTP_USER }}
          PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null
          lftp -u "$USER","$PASS" sftp://"$HOST" <<'LFTP'
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 3
          mirror -R --delete --verbose=1 --parallel=4 \
            --exclude-glob .git* --exclude .git/ --exclude .github/ --exclude tools/ \
            --exclude-glob README.md --exclude-glob wrangler.jsonc --exclude-glob .assetsignore \
            ./ httpdocs/
          bye
          LFTP
